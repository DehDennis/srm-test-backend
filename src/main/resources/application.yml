server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:srmdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update

credit-engine:
  base-rate-monthly: 0.0100 # 1.00% a.m.
  spreads:
    DUPLICATA: 0.0150       # 1.50% a.m.
    CHEQUE: 0.0250          # 2.50% a.m.
  currencies:
    BRL: 1.0000
    USD: 5.4321
