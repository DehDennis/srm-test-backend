services:
  postgres:
    image: postgres:15-alpine
    container_name: srm-postgres
    environment:
      POSTGRES_DB: srm_db
      POSTGRES_USER: srm_user
      POSTGRES_PASSWORD: srm_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U srm_user -d srm_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: srm-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/srm_db
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATASOURCE_USERNAME: srm_user
      SPRING_DATASOURCE_PASSWORD: srm_password
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
